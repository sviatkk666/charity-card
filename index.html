<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Благодійний фонд «Освіта. Наука. Медицина»</title>
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cc-cream:  #FAF7F2;
    --cc-ink:    #0A2236;
    --cc-text-2: #4A5C68;
    --cc-text-3: #6B7A85;
    --cc-blue:   #13548C;
    --cc-line:   #DFE3DF;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--cc-cream);
    color: var(--cc-ink);
    font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  main {
    width: 100%;
    max-width: 460px;
    text-align: center;
  }
  img.mark {
    width: 92px;
    height: auto;
    margin: 0 auto 28px;
    display: block;
  }
  h1 {
    font-family: 'Montserrat', system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(20px, 5vw, 26px);
    line-height: 1.3;
    letter-spacing: -0.01em;
    margin: 0 0 14px;
  }
  p {
    font-size: 15px;
    line-height: 1.65;
    color: var(--cc-text-2);
    margin: 0 0 10px;
  }
  .rule {
    width: 48px;
    height: 1px;
    background: var(--cc-line);
    border: 0;
    margin: 30px auto;
  }
  .fund {
    font-family: 'Montserrat', system-ui, sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--cc-text-3);
    margin: 0 0 6px;
  }
  a {
    color: var(--cc-blue);
    text-decoration: none;
    border-bottom: 1px solid rgba(19, 84, 140, 0.28);
    padding-bottom: 1px;
  }
  a:hover { border-bottom-color: var(--cc-blue); }
  .contact { font-size: 14px; color: var(--cc-text-3); }
</style>
</head>
<body>
<main>
  <img class="mark" src="assets/logo-mark-cream.png" alt="Логотип фонду: розгорнута книга, атом і медичний хрест">
  <h1>Сайт тимчасово недоступний</h1>
  <p>Сторінка фонду наразі закрита для публічного доступу. Ми повернемося пізніше.</p>
  <hr class="rule">
  <p class="fund">Благодійний фонд «Освіта. Наука. Медицина»</p>
  <p class="contact">З питань співпраці: <a href="mailto:co.cf.esm@gmail.com">co.cf.esm@gmail.com</a></p>
</main>
</body>
</html>
